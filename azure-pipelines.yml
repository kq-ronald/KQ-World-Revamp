trigger:
  batch: true
  branches:
    include:
      - feature/*
      - main
      - master
      - develop

# Azure Repos PR validation is configured through target-branch policies.
pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: '22.x'

steps:
  - checkout: self
    clean: true

  - task: NodeTool@0
    displayName: Use Node.js 22
    inputs:
      versionSpec: '$(nodeVersion)'

  - script: npm ci
    displayName: Install locked project dependencies

  - script: ./node_modules/.bin/heft build --clean --production
    displayName: Build production solution and run configured lint checks

  - script: ./node_modules/.bin/heft package-solution --production
    displayName: Create SharePoint package

  - bash: |
      set -euo pipefail
      shopt -s nullglob
      packages=(sharepoint/solution/*.sppkg)
      if [ "${#packages[@]}" -eq 0 ]; then
        echo 'No .sppkg found. Check paths.zippedPackage in config/package-solution.json.'
        exit 1
      fi
      mkdir -p "$PACKAGE_OUTPUT"
      cp "${packages[@]}" "$PACKAGE_OUTPUT/"
    displayName: Collect generated packages
    env:
      PACKAGE_OUTPUT: $(Build.ArtifactStagingDirectory)/kq-world-package

  - task: PublishPipelineArtifact@1
    displayName: Publish downloadable SharePoint package
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/kq-world-package'
      artifact: kq-world-package
      publishLocation: pipeline
